<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test Mate</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0000ff">
</head>
<body>
  <h1>Test Mate</h1>
  <button id="addBtn">Add Subject</button>

  <div id="display">

  </div>
  <br /><br />

  <dialog id="subjectDialog">
    <form id="subjectForm">
      <label>
        Subject:
        <input type="text" id="subjectName" placeholder="Enter Subject Name" required>
      </label>

      <label>
        Grade:
        <input type="number" id="subjectGrade" placeholder="Enter Subject Grade" required>
      </label>

      <button id="submitBtn" type="submit">OK</button>
      <button id="cancelBtn">X</button>
    </form>
  </dialog>

<form id="analyzeForm">
  <label for="fullNameInput">Full Name: </label>
  <input type="text" id="fullNameInput" placeholder="Full Name..." required>
  
   <label for="studyHoursInput">Study Hours: </label>
  <input type="number" id="studyHoursInput" placeholder="Number of study hours" required 
  min="3"
  step="0.5"
  oninvalid="this.setCustomValidity('More study time, more progress! Aim for at least 3 hours. 🔥 📚')"
    oninput="this.setCustomValidity('')"
/>
  
  <button type="submit" id="analyzeBtn">Analyze</button>
</form>
<script src="index.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js")
        .then(() => console.log("Service Worker registered!"))
        .catch((error) => console.error("Service Worker registration failed:", error));
    });
  }
</script>
</body>
</html>
